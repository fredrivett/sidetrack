services:
  sidetrack:
    # The published image. SIDETRACK_TAG picks a release (`latest`, or a
    # version such as `0.1` or `0.1.0`), or `main` for every merged change.
    image: ghcr.io/fredrivett/sidetrack:${SIDETRACK_TAG:-latest}
    # Only used to build from source instead: `docker compose up -d --build`
    # in a clone of the repository.
    build:
      context: .
      args:
        # Optional. Keeps Server Action IDs the same across rebuilds, so tabs
        # left open through an update can still save. Generate with:
        # openssl rand -base64 32. Unset = a fresh key on every build.
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
        # Optional. Your own PostHog project key for browser analytics; it is
        # inlined into the client bundle, so it must be present at build time.
        # Unset = no browser analytics.
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    container_name: sidetrack
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Required. Generate with: openssl rand -hex 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Required. The URL the app is reachable at — set-cookie domain depends
      # on this matching the host you actually serve from. No localhost
      # default: a silent fallback would misconfigure the auth origin on a
      # real deployment (cookies wouldn't stick) with no error.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      # Optional. unset/false → first signup wins, then signup is locked.
      # true → signup stays open (multi-tenant instances).
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Optional. Outbound email for password resets: SMTP_URL (any
      # smtp(s):// server) or RESEND_API_KEY + EMAIL_FROM. Unset = reset
      # links are printed to `docker compose logs` instead.
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional. Emails this address whenever someone new signs up, through
      # the SMTP or Resend settings above (with neither, the signup is only
      # logged). Best-effort: a failed send never blocks the signup.
      SIGNUP_NOTIFY_EMAIL: ${SIGNUP_NOTIFY_EMAIL:-}
      # Optional. Comma-separated user ids who can open /admin, which shows
      # every account's usage. Unset = /admin is a 404 for everyone.
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      # Optional. Enables AI list-icon suggestions. Unset = off.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Optional. Web Push keys for push notifications, from
      # `npx web-push generate-vapid-keys`: both or neither. Unset = off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional. Set your own PostHog key to enable server-side error tracking.
      # Unset = disabled, nothing is sent anywhere.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    volumes:
      - sidetrack-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sidetrack-data:
