services:
  sidetrack:
    build: .
    image: sidetrack:latest
    container_name: sidetrack
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Required. Generate with: openssl rand -hex 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Required. The URL the app is reachable at — set-cookie domain depends
      # on this matching the host you actually serve from.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Optional. unset/false → first signup wins, then signup is locked.
      # true → signup stays open (multi-tenant instances).
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Optional. Set your own PostHog key to enable server-side error tracking.
      # Unset = disabled, nothing is sent anywhere.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    volumes:
      - sidetrack-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sidetrack-data:
