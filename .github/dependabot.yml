version: 2
updates:
  # App dependencies. The npm ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Collapse the routine churn into one PR per week per stream.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Keep the CI workflow's actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
