version: 2
updates:
  # App dependencies. The npm ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Match pnpm's minimum-release-age: skip versions published < 7 days ago.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Collapse the routine churn into one PR per week per stream.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # The Dockerfile's node:22-alpine base, so the published image picks up a
  # new Node 22 release. The weekly image rebuild covers Alpine's own fixes.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Major Node upgrades are deliberate, alongside CI's node-version.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Keep the CI workflow's actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
