name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Run the seed end-to-end against a throwaway DB so schema/gate drift
      # (e.g. a new required column, or a change to the signup gate) fails the
      # build here rather than silently in a worktree/preview setup. The seed
      # exits non-zero on any error; the row check guards against it skipping
      # silently (e.g. an inverted "fresh DB" guard).
      - name: Seed smoke test
        env:
          DB_PATH: /tmp/seed-ci.db
          SIDETRACK_SEED: "true"
          BETTER_AUTH_SECRET: ci-seed-smoke-test-secret-0123456789abcdef
        run: |
          pnpm db:migrate
          pnpm db:seed
          count=$(sqlite3 "$DB_PATH" "SELECT count(*) FROM users;")
          [ "$count" -ge 2 ] || { echo "seed smoke test: expected >= 2 users, got $count"; exit 1; }

  security:
    name: semgrep (owasp top ten)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/owasp-top-ten --error
