name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.19.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Fail when src/core/schema.ts (or auth-schema.ts) changed without the
      # generated migration being committed. `git status` also catches a new,
      # untracked migration file, which `git diff` would miss.
      - name: Migration drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- src/core/migrations)" ]; then
            git status --short -- src/core/migrations
            echo "Schema changed without a committed migration: run pnpm db:generate and commit the result."
            exit 1
          fi

      # The production build catches errors lint, tsc and tests don't, such as
      # server-only code imported into a client component.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      # End-to-end tests against the build above (e2e/AGENTS.md). Chromium
      # only; a failure's trace is in the uploaded report.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Run the seed end-to-end against a throwaway DB so schema/gate drift
      # (e.g. a new required column, or a change to the signup gate) fails the
      # build here rather than silently in a worktree/preview setup. The seed
      # exits non-zero on any error; the row check guards against it skipping
      # silently (e.g. an inverted "fresh DB" guard).
      - name: Seed smoke test
        env:
          DB_PATH: /tmp/seed-ci.db
          SIDETRACK_SEED: "true"
          BETTER_AUTH_SECRET: ci-seed-smoke-test-secret-0123456789abcdef
        run: |
          pnpm db:migrate
          pnpm db:seed
          count=$(sqlite3 "$DB_PATH" "SELECT count(*) FROM users;")
          [ "$count" -ge 2 ] || { echo "seed smoke test: expected >= 2 users, got $count"; exit 1; }

  security:
    name: semgrep (owasp top ten)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The job name stays as is: it's a required status check on main.
      # p/secrets: the repo is public, so a committed key is a leaked key.
      - run: semgrep scan --config p/owasp-top-ten --config p/secrets --error
