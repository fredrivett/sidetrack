"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Migrate + seed run via the `predev` hook on `pnpm dev`, so they apply to the
# root repo and every workspace (and self-heal if a DB is recreated).
setup = """
pnpm install
ln -sfn "$CONDUCTOR_ROOT_PATH/.env.local" .env.local
mkdir -p data"""
run = "BETTER_AUTH_URL=\"http://localhost:$CONDUCTOR_PORT\" pnpm dev --port \"$CONDUCTOR_PORT\""
run_mode = "concurrent"
