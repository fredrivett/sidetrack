    <rect x="3" y="5" width="5" height="1"/>
    <rect x="4" y="7" width="8" height="1"/>
    <rect x="8" y="9" width="5" height="1"/>
    <rect x="3" y="11" width="9" height="1"/>
  </g>
</svg>
